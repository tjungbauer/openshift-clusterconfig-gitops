---
# Starting point of the fleet, the same idea as base/init_app_of_apps.
# Installed once with Helm. It creates one Application: fleet-applicationsets.
helper-argocd:
  applications:
    fleet-applicationsets:
      enabled: true
      server: https://kubernetes.default.svc
      namespace: {}
      project: default
      description: "Creates one ApplicationSet per cluster of clusters-ng"
      labels:
        category: fleet
      # No syncPolicy on purpose: this Application must be synced manually.

      multiple_sources:
          # Define repository of the values-file
        - repoUrl: https://github.com/tjungbauer/openshift-clusterconfig-gitops
          targetRevision: main
          ref: values
          # Define Helm Chart repository
        - repoUrl: "https://charts.stderr.at/"
          chart: helper-argocd
          targetRevision: 2.0.48
          # Path to the values file
          helm:
            default_values_file: $values/fleet/applicationsets/values.yaml

  general:
    server: dummy
