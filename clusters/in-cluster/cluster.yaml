---
# Charts deployed to the cluster "in-cluster". This file only defines WHAT is deployed.
# The values are in ./values/<key>.yaml and ../defaults/<chart>.yaml.
# Generated from clusters/management-cluster, no chart order exists between the entries.
#
# Rules (evaluated by the ApplicationSet in ./applicationset.yaml):
#   - The directory name must equal the cluster name known to Argo CD.
#   - Every key results in one Application. Its values are in ./values/<key>.yaml
#   - The same chart can be used several times with different keys.
#   - Possible settings of a chart:
#       enabled:       set to false to skip the chart (default: true).
#                      Must be a boolean: the string "false" counts as true.
#       chart:         chart name (default: the key)
#       repoURL:       Helm repository (default: https://charts.stderr.at/)
#       namespace:     destination namespace (default: the chart name)
#       chartVersion:  chart version (default: "*" = latest, so pin it)
#   - A chart without settings must be written as "name: {}".
#   - Do not use these keys, they collide with the parameters of the ApplicationSet:
#       path, app, chart, repoURL, namespace, chartVersion


