---
# Source: clusters/management-cluster/setup-rh-build-of-keycloak/values.yaml, key "cert-manager"
enabled: true

certificates:
  enabled: true

  # List of certificates
  certificate:
    - name: keycloak-certificate
      enabled: true
      namespace: "keycloak"
      syncwave: "0"
      secretName: keycloak-certificate

      dnsNames:
        - sso.apps.ocp.aws.ispworld.at

      # Reference to the issuer that shall be used.
      issuerRef:
        name: letsencrypt-prod
        kind: ClusterIssuer
