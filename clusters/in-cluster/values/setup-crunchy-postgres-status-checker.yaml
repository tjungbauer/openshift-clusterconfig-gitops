---
# Source: clusters/management-cluster/setup-crunchy-postgres/values.yaml, key "helper-status-checker"
enabled: true
approver: true

# List of checks that shall be performed.
checks:
  - operatorName: postgresoperator
    subscriptionName: crunchy-postgres-operator
    sleeptimer: 60
    maxretries: 100
    syncwave: '0'
    namespace:
      name: "crunchy-postgres-operator"

    serviceAccount:
      name: "status-checker-crunchy-postgres-operator"
