---
# Source: clusters/management-cluster/setup-openshift-data-foundation/values.yaml, key "helper-operator"

console_plugins:
  enabled: true
  plugins:
    - odf-console
  job_namespace: kube-system

operators:
  odf-operator:
    enabled: true
    syncwave: '0'
    namespace:
      name: openshift-storage
      create: true
    subscription:
      channel: stable-4.20
      approval: Automatic
      operatorName: odf-operator
      source: redhat-operators
      sourceNamespace: openshift-marketplace
    operatorgroup:
      create: true
