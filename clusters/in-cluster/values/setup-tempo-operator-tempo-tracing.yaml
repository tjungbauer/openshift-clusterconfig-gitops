---
# Source: clusters/management-cluster/setup-tempo-operator/values.yaml, key "tempo-tracing"
tempostack:
  enabled: true
  name: simplest

  managementState: Managed

  namespace:
    create: true
    name: tempostack
    descr: "Namespace for the TempoStack"
    display: "TempoStack"
    additionalAnnotations: {}
    additionalLabels: {}

  storage:
    secret:
      name: tempo-s3
      type: s3
      credentialMode: static

  storageSize: 500Gi
  replicationFactor: 1
  serviceAccount: tempo-simplest

  tenants:
    mode: openshift
    enabled: true

    authentication:
      - tenantName: 'tenantA'
        tenantId: '1610b0c3-c509-4592-a256-a1871353dbfc'
        permissions:
          - write
          - read

      - tenantName: 'tenantB'
        tenantId: '1610b0c3-c509-4592-a256-a1871353dbfd'
        permissions:
          - write
          - read

  observability:
    enabled: true

    tracing:
      jaeger_agent_endpoint: 'localhost:6831'
      otlp_http_endpoint: 'http://localhost:4320'

  template:
    gateway:
      enabled: true
      rbac: false

      ingress:
        type: 'route'
        termination: 'reencrypt'
      component:
        replicas: 1

    queryFrontend:
      jaegerQuery:
        enabled: true
      component:
        replicas: 1
