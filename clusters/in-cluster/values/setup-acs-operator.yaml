---
# Source: clusters/management-cluster/setup-acs/values.yaml, key "helper-operator"
operators:
  rhacs-operator:
    enabled: true
    syncwave: '0'
    namespace:
      name: rhacs-operator
      create: true
    subscription:
      channel: stable
      approval: Automatic
      operatorName: rhacs-operator
      source: redhat-operators
      sourceNamespace: openshift-marketplace
    operatorgroup:
      create: true
      # rhacs does not support to monitor own namespace,
      # therefor the spec in the OperatorGroup must be empty
      notownnamespace: true
