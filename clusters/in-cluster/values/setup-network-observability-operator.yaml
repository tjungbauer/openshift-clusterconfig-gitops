---
# Source: clusters/management-cluster/setup-network-observability/values.yaml, key "helper-operator"
console_plugins:
  enabled: true
  plugins:
    - netobserv-plugin

  job_namespace: kube-system

operators:
  netobserv-operator:
    enabled: true
    syncwave: '0'
    namespace:
      name: openshift-netobserv-operator
      create: true
    subscription:
      channel: stable
      source: redhat-operators
      approval: Automatic
      operatorName: netobserv-operator
      sourceNamespace: openshift-marketplace
    operatorgroup:
      create: true
      notownnamespace: true
