---
# Source: clusters/management-cluster/setup-openshift-logging/values.yaml, key "helper-lokistack"
# -- Enable or disable LokiStack configuration
# @default -- false
enabled: true

# -- Name of the LokiStack object
name: logging-loki

# -- Namespace of the LokiStack object
namespace: openshift-logging

# -- Syncwave for the LokiStack object.
# @default -- 3
syncwave: 3

# -- This is for log streams only, not the retention of the object store. Data retention must be configured on the bucket.
global_retention_days: 4

# storage settings
storage:

  # -- Size defines one of the supported Loki deployment scale out sizes.
  # Can be either:
  #   - 1x.demo
  #   - 1x.extra-small (Default)
  #   - 1x.small
  #   - 1x.medium
  # @default -- 1x.extra-small
  # size: 1x.extra-
  size: 1x.demo

  # Secret for object storage authentication. Name of a secret in the same namespace as the LokiStack custom resource.
  secret:

    # -- Name of a secret in the namespace configured for object storage secrets.
    name: logging-loki-s3

    # Type of object storage that should be used
    # Can bei either:
    #  - swift
    #  - azure
    #  - s3 (default)
    #  - alibabacloud
    #  - gcs
    # -- Type of object storage that should be used
    # @default -- s3
    # type: s3

  # Schemas for reading and writing logs.
  # schemas:
    # -- Version for writing and reading logs.
    # Can be v11, v12 or v13
    # @default -- v13
    #  - version: v13

    # -- EffectiveDate is the date in UTC that the schema will be applied on. To ensure readibility of logs, this date should be before the current date in UTC.
    # @default -- 2020-10-11
    #    effectiveDate: "2020-10-11"

# -- Storage class name defines the storage class for ingester/querier PVCs.
# @default -- gp3-csi
storageclassname: gp3-csi

# -- Mode defines the mode in which lokistack-gateway component will be configured.
# Can be either: static (default), dynamic, openshift-logging, openshift-network
# @default -- static
mode: openshift-logging

# -- Control pod placement for LokiStack components. You can define a list of tolerations for the following components:
# compactor, distributer, gateway, indexGateway, ingester, querier, queryFrontend, ruler
podPlacements:
  # Pod placement of compactor
  compactor:
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/infra
        operator: Equal
        value: reserved
      - effect: NoExecute
        key: node-role.kubernetes.io/infra
        operator: Equal
        value: reserved
  # Pod placement of distributor
  distributor:
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/infra
        operator: Equal
        value: reserved
      - effect: NoExecute
        key: node-role.kubernetes.io/infra
        operator: Equal
        value: reserved
  # Pod placement of gateway
  gateway:
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/infra
        operator: Equal
        value: reserved
      - effect: NoExecute
        key: node-role.kubernetes.io/infra
        operator: Equal
        value: reserved
  # Pod placement of indexGateway
  indexGateway:
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/infra
        operator: Equal
        value: reserved
      - effect: NoExecute
        key: node-role.kubernetes.io/infra
        operator: Equal
        value: reserved
  # Pod placement of ingester
  ingester:
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/infra
        operator: Equal
        value: reserved
      - effect: NoExecute
        key: node-role.kubernetes.io/infra
        operator: Equal
        value: reserved
  # Pod placement of querier
  querier:
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/infra
        operator: Equal
        value: reserved
      - effect: NoExecute
        key: node-role.kubernetes.io/infra
        operator: Equal
        value: reserved
  # Pod placement of queryFrontend
  queryFrontend:
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/infra
        operator: Equal
        value: reserved
      - effect: NoExecute
        key: node-role.kubernetes.io/infra
        operator: Equal
        value: reserved
  # Pod placement of ruler
  ruler:
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/infra
        operator: Equal
        value: reserved
      - effect: NoExecute
        key: node-role.kubernetes.io/infra
        operator: Equal
        value: reserved
