---
# Source: clusters/management-cluster/setup-openshift-logging/values.yaml, key "openshift-logging"

loggingConfig:
  enabled: true
  syncwave: '4'
  operatorVersion: '6.0'
  managementState: Managed

  collectorServiceAccount:
    name: cluster-logging-operator
    create: false
    bindings:
      - collect-audit-logs
      - collect-application-logs
      - collect-infrastructure-logs

  additionalClusterRoles:
    - type: application
      name: cluster-logging-write-application-logs
      enabled: true
    - type: audit
      name: cluster-logging-write-audit-logs
      enabled: true
    - type: infrastructure
      name: cluster-logging-write-infrastructure-logs
      enabled: true
    - type: editor
      name: clusterlogforwarder-editor-role
      enabled: true

  outputs:
    - name: default-lokistack
      type: lokiStack
      tls:
        ca:
          configMapName: openshift-service-ca.crt
          key: service-ca.crt

      lokiStack:
        authentication:
          token:
            from: serviceAccount

        target:
          name: logging-loki
          namespace: openshift-logging

  pipelines:
    - name: default-lokistack
      inputRefs:
        - application
        - infrastructure
        - audit
      outputRefs:
        - default-lokistack
      filterRefs:
        - detectexception
        - parse-json

  filters:
  - name: detectexception
    type: detectMultilineException
  - name: parse-json
    type: parse

  collector: {}
