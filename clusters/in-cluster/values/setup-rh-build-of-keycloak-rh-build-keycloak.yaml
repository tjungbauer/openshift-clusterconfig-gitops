---
# Source: clusters/management-cluster/setup-rh-build-of-keycloak/values.yaml, key "rh-build-keycloak"
enabled: true

namespace:
  name: "keycloak"
  create: true

keycloak:
  name: keycloak
  namespace: "keycloak"

  hostname:
    hostname: sso.apps.ocp.aws.ispworld.at

  http:
    tlsSecret: "keycloak-certificate"

  db:
    use_example_db_sta: true
    exmple_db_user: testuser
    example_db_pass: ""

  additionalAnnotations:
    argocd.argoproj.io/sync-wave: '10'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
